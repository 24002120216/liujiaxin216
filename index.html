<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电视剧热门排行榜 - 刘佳欣</title>
    <!-- 作者：刘佳欣 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 刘佳欣：排行榜容器 -->
    <div class="ljx_rank-card">

        <!-- 刘佳欣：Tab 切换栏 -->
        <div class="ljx_tab-bar">
            <div class="ljx_tab-item ljx_tab-item--active" data-ljx-tab="daily">每日</div>
            <div class="ljx_tab-item" data-ljx-tab="weekly">每周</div>
            <div class="ljx_tab-item" data-ljx-tab="monthly">每月</div>
            <div class="ljx_tab-item" data-ljx-tab="all">全部</div>
        </div>

        <!-- 刘佳欣：排行榜列表区域（左右两列） -->
        <div class="ljx_rank-body">

            <!-- 刘佳欣：左列（第 1-5 名） -->
            <div class="ljx_rank-col ljx_rank-col--left">
                <!-- 刘佳欣：第 1 名 -->
                <div class="ljx_rank-row">
                    <span class="ljx_rank-badge ljx_rank-badge--top">1</span>
                    <span class="ljx_rank-title">最美的时光</span>
                </div>
                <!-- 刘佳欣：第 2 名 -->
                <div class="ljx_rank-row">
                    <span class="ljx_rank-badge ljx_rank-badge--top">2</span>
                    <span class="ljx_rank-title">咱们结婚吧</span>
                </div>
                <!-- 刘佳欣：第 3 名 -->
                <div class="ljx_rank-row">
                    <span class="ljx_rank-badge ljx_rank-badge--top">3</span>
                    <span class="ljx_rank-title">渗透</span>
                </div>
                <!-- 刘佳欣：第 4 名 -->
                <div class="ljx_rank-row">
                    <span class="ljx_rank-badge">4</span>
                    <span class="ljx_rank-title">继承者们</span>
                </div>
                <!-- 刘佳欣：第 5 名 -->
                <div class="ljx_rank-row">
                    <span class="ljx_rank-badge">5</span>
                    <span class="ljx_rank-title">烽火佳人</span>
                </div>
            </div>

            <!-- 刘佳欣：右列（第 6-10 名） -->
            <div class="ljx_rank-col ljx_rank-col--right">
                <!-- 刘佳欣：第 6 名 -->
                <div class="ljx_rank-row">
                    <span class="ljx_rank-badge">6</span>
                    <span class="ljx_rank-title">极品女士第2季</span>
                </div>
                <!-- 刘佳欣：第 7 名 -->
                <div class="ljx_rank-row">
                    <span class="ljx_rank-badge">7</span>
                    <span class="ljx_rank-title">爱闪亮</span>
                </div>
                <!-- 刘佳欣：第 8 名 -->
                <div class="ljx_rank-row">
                    <span class="ljx_rank-badge">8</span>
                    <span class="ljx_rank-title">狼烟（2013）</span>
                </div>
                <!-- 刘佳欣：第 9 名 -->
                <div class="ljx_rank-row">
                    <span class="ljx_rank-badge">9</span>
                    <span class="ljx_rank-title">钱多多炼爱记</span>
                </div>
                <!-- 刘佳欣：第 10 名 -->
                <div class="ljx_rank-row">
                    <span class="ljx_rank-badge">10</span>
                    <span class="ljx_rank-title">苍狼</span>
                </div>
            </div>

        </div>

    </div>

    <!-- 刘佳欣：引入交互脚本 -->
    <script src="script.js"></script>
</body>
</html>
